name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  benchmark:
    # Downloads the Russian Readability Corpus from kpfu.ru and BAREC from
    # HuggingFace, so these can fail for reasons that have nothing to do with the
    # code. Kept separate from `test`.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Only the two that download a fixed archive. The paired and Turkish
      # benchmarks walk the Wikipedia and Wikisource APIs article by article,
      # which takes far too long for CI and is unkind to those services; run
      # them by hand.
      - run: npm run benchmark:ru
      - run: npm run benchmark:ar
